<section class="container py-5">
	<div class="row justify-content-center">
		<div class="col-12 col-sm-10 col-md-8 col-lg-5">
			<div class="card shadow-sm border-0 login-card">
				<div class="card-body p-4 p-md-5">
					<h1 class="h3 mb-2 text-center">Welcome Back</h1>
					<p class="text-muted text-center mb-4">Login to continue shopping your favorite books.</p>

					<form (ngSubmit)="onSubmit()" [formGroup]="loginForm" novalidate>
						<div class="mb-3">
							<label for="email" class="form-label">Username or Email</label>
							<input
								id="email"
								type="email"
								class="form-control"
								placeholder="Enter username or email"
								autocomplete="username"
								formControlName="email"
								required
								[class.is-invalid]="isInvalid('email')"
							/>
							@if (isInvalid('email')) {<div class="invalid-feedback">
								Please enter a valid email or username.
							</div>}
						</div>

						<div class="mb-4">
							<label for="password" class="form-label">Password</label>
							<input
								id="password"
								type="password"
								class="form-control"
								placeholder="Enter password"
								autocomplete="current-password"
								formControlName="password"
								required
								[class.is-invalid]="isInvalid('password')"
							/>
							@if (isInvalid('password')) {<div class="invalid-feedback">
								Please enter a valid password.
							</div>}
						</div>

						<button type="submit" class="btn btn-primary w-100" [disabled]="isSubmitted()">Login</button>
					</form>

					<div class="d-flex align-items-center justify-content-center gap-2 mt-4">
						<span class="text-muted">New to Book Store?</span>
						<a routerLink="/signup" class="btn btn-outline-primary btn-sm">Signup</a>
					</div>
				</div>
			</div>
		</div>
	</div>
</section>
